<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="520" height="250">
<defs>
<style>
text  { font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; }
.nm   { font-size: 10px; font-weight: 700; fill: #333; }
.ds   { font-size: 8.5px; fill: #555; }
.sg   { font-size: 9px; font-weight: 700; fill: #222; text-anchor: middle; paint-order: stroke; stroke: #FFFFFF; stroke-width: 3px; stroke-linejoin: round; }
.lg   { font-size: 9px; fill: #444; }
.seg  { stroke: #444; stroke-width: 1; }
.plain { fill: #FFFFFF; }
.light { fill: #E4E4E4; }
.dark  { fill: #8A8A8A; }
.hatch { stroke: #AAA; stroke-width: 1.2; }
.dot   { fill: #999; }
@media (prefers-color-scheme: dark) {
  .nm { fill: #E6E6E6; }
  .ds { fill: #AAA; }
  .lg { fill: #CCC; }
  .sg { fill: #F2F2F2; stroke: #1E1E1E; }
  .seg { stroke: #CCC; }
  .plain { fill: #1E1E1E; }
  .light { fill: #3A3A3A; }
  .dark { fill: #6A6A6A; }
  .hatch { stroke: #777; }
  .dot { fill: #777; }
}
</style>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
  <line class="hatch" x1="0" y1="0" x2="0" y2="6"/>
</pattern>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
  <circle class="dot" cx="3" cy="3" r="1.1"/>
</pattern>
</defs>

<!-- Each bar is one whole drink (400 px). Roles differ by fill pattern, shown in the key. -->
<text class="nm" x="10" y="42">Saratoga</text>
<text class="ds" x="10" y="54">1887</text>
<rect class="seg light" x="110" y="26" width="133.3" height="34"/>
<text class="sg" x="176.7" y="47">brandy 1</text>
<rect class="plain" x="243.3" y="26" width="133.3" height="34"/>
<rect class="seg" x="243.3" y="26" width="133.3" height="34" fill="url(#hatch)"/>
<text class="sg" x="310" y="47">whiskey 1</text>
<rect class="plain" x="376.7" y="26" width="133.3" height="34"/>
<rect class="seg" x="376.7" y="26" width="133.3" height="34" fill="url(#dots)"/>
<text class="sg" x="443.3" y="47">vermouth 1</text>

<text class="nm" x="10" y="98">Vieux Carré</text>
<text class="ds" x="10" y="110">late 1930s</text>
<rect class="seg light" x="110" y="82" width="126.3" height="34"/>
<text class="sg" x="173.2" y="103">rye 30 ml</text>
<rect class="plain" x="236.3" y="82" width="126.3" height="34"/>
<rect class="seg" x="236.3" y="82" width="126.3" height="34" fill="url(#hatch)"/>
<text class="sg" x="299.5" y="103">cognac 30 ml</text>
<rect class="plain" x="362.6" y="82" width="126.3" height="34"/>
<rect class="seg" x="362.6" y="82" width="126.3" height="34" fill="url(#dots)"/>
<text class="sg" x="425.8" y="103">vermouth 30 ml</text>
<rect class="seg dark" x="488.9" y="82" width="21.1" height="34"/>
<text class="ds" x="510" y="128" text-anchor="end">+ Bénédictine, 1 barspoon</text>

<text class="nm" x="10" y="154">Oaxaca Old</text>
<text class="nm" x="10" y="166">Fashioned</text>
<rect class="seg light" x="110" y="138" width="276.9" height="34"/>
<text class="sg" x="248.5" y="159">reposado tequila 45 ml</text>
<rect class="plain" x="386.9" y="138" width="92.3" height="34"/>
<rect class="seg" x="386.9" y="138" width="92.3" height="34" fill="url(#hatch)"/>
<text class="sg" x="433" y="159">mezcal 15</text>
<rect class="seg dark" x="479.2" y="138" width="30.8" height="34"/>
<text class="ds" x="510" y="184" text-anchor="end">+ agave syrup, 1 teaspoon</text>

<!-- Key -->
<rect class="seg light" x="110" y="204" width="14" height="10"/><text class="lg" x="130" y="213">first base spirit</text>
<rect class="plain" x="230" y="204" width="14" height="10"/><rect class="seg" x="230" y="204" width="14" height="10" fill="url(#hatch)"/><text class="lg" x="250" y="213">second base spirit</text>
<rect class="plain" x="110" y="222" width="14" height="10"/><rect class="seg" x="110" y="222" width="14" height="10" fill="url(#dots)"/><text class="lg" x="130" y="231">modifier</text>
<rect class="seg dark" x="230" y="222" width="14" height="10"/><text class="lg" x="250" y="231">sweetener or liqueur</text>
<text class="ds" x="110" y="246">Each bar is the whole drink; bitters not shown.</text>
</svg>
