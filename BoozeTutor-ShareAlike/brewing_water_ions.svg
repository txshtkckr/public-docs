<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300">
<defs>
<style>
text  { font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; }
.ion  { font-size: 11px; font-weight: 700; fill: #333; }
.city { font-size: 9px; fill: #444; text-anchor: end; }
.val  { font-size: 9px; fill: #333; }
.note { font-size: 8.5px; fill: #777; text-anchor: middle; }
.bar  { fill: #6F8FAF; }
.base { stroke: #999; stroke-width: 0.8; }
@media (prefers-color-scheme: dark) {
  .ion { fill: #E6E6E6; }
  .city { fill: #BBB; }
  .val { fill: #DDD; }
  .note { fill: #999; }
  .bar { fill: #7FA3C8; }
  .base { stroke: #666; }
}
</style>
</defs>

<!-- Calcium -->
<text class="ion" x="10" y="24">Calcium</text>
<line class="base" x1="62" y1="32" x2="62" y2="122"/>
<text class="city" x="57" y="47">Plzeň</text>
<rect class="bar" x="62" y="38" width="2.3" height="12" rx="1.5"/>
<text class="val" x="68.3" y="47">10</text>
<text class="city" x="57" y="69">Burton</text>
<rect class="bar" x="62" y="60" width="69.2" height="12" rx="1.5"/>
<text class="val" x="135.2" y="69">300</text>
<text class="city" x="57" y="91">Dublin</text>
<rect class="bar" x="62" y="82" width="27.7" height="12" rx="1.5"/>
<text class="val" x="93.7" y="91">120</text>
<text class="city" x="57" y="113">Munich</text>
<rect class="bar" x="62" y="104" width="17.3" height="12" rx="1.5"/>
<text class="val" x="83.3" y="113">75</text>

<!-- Sulphate -->
<text class="ion" x="270" y="24">Sulphate</text>
<line class="base" x1="322" y1="32" x2="322" y2="122"/>
<text class="city" x="317" y="47">Plzeň</text>
<rect class="bar" x="322" y="38" width="1.5" height="12" rx="1.5"/>
<text class="val" x="327.5" y="47">5</text>
<text class="city" x="317" y="69">Burton</text>
<rect class="bar" x="322" y="60" width="150.0" height="12" rx="1.5"/>
<text class="val" x="476.0" y="69">650</text>
<text class="city" x="317" y="91">Dublin</text>
<rect class="bar" x="322" y="82" width="12.7" height="12" rx="1.5"/>
<text class="val" x="338.7" y="91">55</text>
<text class="city" x="317" y="113">Munich</text>
<rect class="bar" x="322" y="104" width="2.3" height="12" rx="1.5"/>
<text class="val" x="328.3" y="113">10</text>

<!-- Chloride -->
<text class="ion" x="10" y="158">Chloride</text>
<line class="base" x1="62" y1="166" x2="62" y2="256"/>
<text class="city" x="57" y="181">Plzeň</text>
<rect class="bar" x="62" y="172" width="1.5" height="12" rx="1.5"/>
<text class="val" x="67.5" y="181">5</text>
<text class="city" x="57" y="203">Burton</text>
<rect class="bar" x="62" y="194" width="6.9" height="12" rx="1.5"/>
<text class="val" x="72.9" y="203">30</text>
<text class="city" x="57" y="225">Dublin</text>
<rect class="bar" x="62" y="216" width="4.6" height="12" rx="1.5"/>
<text class="val" x="70.6" y="225">20</text>
<text class="city" x="57" y="247">Munich</text>
<rect class="bar" x="62" y="238" width="3.5" height="12" rx="1.5"/>
<text class="val" x="69.5" y="247">15</text>

<!-- Bicarbonate -->
<text class="ion" x="270" y="158">Bicarbonate</text>
<line class="base" x1="322" y1="166" x2="322" y2="256"/>
<text class="city" x="317" y="181">Plzeň</text>
<rect class="bar" x="322" y="172" width="3.5" height="12" rx="1.5"/>
<text class="val" x="329.5" y="181">15</text>
<text class="city" x="317" y="203">Burton</text>
<rect class="bar" x="322" y="194" width="64.6" height="12" rx="1.5"/>
<text class="val" x="390.6" y="203">280</text>
<text class="city" x="317" y="225">Dublin</text>
<rect class="bar" x="322" y="216" width="73.8" height="12" rx="1.5"/>
<text class="val" x="399.8" y="225">320</text>
<text class="city" x="317" y="247">Munich</text>
<rect class="bar" x="322" y="238" width="57.7" height="12" rx="1.5"/>
<text class="val" x="383.7" y="247">250</text>

<text class="note" x="260" y="290">Rounded typical figures in mg/L; published values vary, Burton’s most of all.</text>
</svg>
