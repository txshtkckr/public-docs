<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 210" width="520" height="210">
<defs>
<style>
text  { font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; }
.name { font-size: 12px; font-weight: 700; fill: #333; text-anchor: middle; }
.clim { font-size: 9px; fill: #666; text-anchor: middle; }
.row  { font-size: 8.5px; font-weight: 700; fill: #555; }
.val  { font-size: 9px; fill: #333; }
.note { font-size: 8px; fill: #777; text-anchor: middle; }
.track { fill: #EEE; }
.bar  { fill: #B5793A; }
.range { fill: #D9B58C; }
.up   { fill: #3F8F4F; }
.down { fill: #B0453A; }
.div  { stroke: #DDD; stroke-width: 0.8; }
@media (prefers-color-scheme: dark) {
  .name { fill: #DDD; }
  .clim { fill: #AAA; }
  .row  { fill: #BBB; }
  .val  { fill: #DDD; }
  .note { fill: #999; }
  .track { fill: #333; }
  .bar  { fill: #C98A4A; }
  .range { fill: #7A5A38; }
  .up   { fill: #5FB06F; }
  .down { fill: #D0655A; }
  .div  { stroke: #444; }
}
</style>
</defs>

<!-- Three panels, 170 wide, centres at 87, 260, 433. Bars: 10% a year = 120 px. -->
<line class="div" x1="173" y1="12" x2="173" y2="182"/>
<line class="div" x1="347" y1="12" x2="347" y2="182"/>

<!-- Scotland -->
<text class="name" x="87" y="26">Scotland</text>
<text class="clim" x="87" y="40">cool, damp</text>
<text class="row" x="27" y="66">Lost each year</text>
<rect class="track" x="27" y="72" width="120" height="12" rx="2"/>
<rect class="bar" x="27" y="72" width="24" height="12" rx="2"/>
<text class="val" x="27" y="98">about 2%</text>
<text class="row" x="27" y="124">Strength in the cask</text>
<polygon class="down" points="35,136 47,136 47,150 53,150 41,162 29,150 35,150"/>
<text class="val" x="60" y="148">falls slowly</text>
<text class="val" x="60" y="159">(more alcohol lost)</text>

<!-- Kentucky -->
<text class="name" x="260" y="26">Kentucky</text>
<text class="clim" x="260" y="40">hot summers, cold winters</text>
<text class="row" x="200" y="66">Lost each year</text>
<rect class="track" x="200" y="72" width="120" height="12" rx="2"/>
<rect class="bar" x="200" y="72" width="36" height="12" rx="2"/>
<rect class="range" x="236" y="72" width="24" height="12"/>
<text class="val" x="200" y="98">about 3–5%</text>
<text class="row" x="200" y="124">Strength in the cask</text>
<polygon class="up" points="208,162 220,162 220,148 226,148 214,136 202,148 208,148"/>
<text class="val" x="233" y="148">often rises</text>
<text class="val" x="233" y="159">(more water lost)</text>

<!-- Caribbean -->
<text class="name" x="433" y="26">Caribbean</text>
<text class="clim" x="433" y="40">hot, humid</text>
<text class="row" x="373" y="66">Lost each year</text>
<rect class="track" x="373" y="72" width="120" height="12" rx="2"/>
<rect class="bar" x="373" y="72" width="72" height="12" rx="2"/>
<rect class="range" x="445" y="72" width="48" height="12"/>
<text class="val" x="373" y="98">about 6–10%</text>
<text class="row" x="373" y="124">Strength in the cask</text>
<polygon class="down" points="381,136 393,136 393,150 399,150 387,162 375,150 381,150"/>
<text class="val" x="406" y="148">falls</text>
<text class="val" x="406" y="159">(big losses)</text>

<text class="note" x="260" y="198">Rough yearly averages; every warehouse, and every floor, differs.</text>
</svg>
