<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 540" width="500" height="540">
<!-- cx=250 cy=255  r_in=65 r_out_main=125 r_in_sub=128 r_out_sub=215 -->
<!-- 8 segments × 45° each, 4° gap → 41° arc per segment -->
<defs>
<style>
text { font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; }
.lbl { font-size: 10px; font-weight: 700; fill: #111; text-anchor: middle; dominant-baseline: middle; }
.sub { font-size: 7.5px; fill: #333; text-anchor: middle; }
.ctr { font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
.title { font-size: 10.5px; fill: #777; text-anchor: middle; }
.ctr-circ { fill: white; stroke: #ccc; stroke-width: 1.5; }
@media (prefers-color-scheme: dark) {
  .lbl { fill: #f0f0f0; }
  .sub { fill: #222; }
  .ctr { fill: #f0f0f0; }
  .title { fill: #888; }
  .ctr-circ { fill: #1c1c1e; stroke: #555; }
}
</style>
</defs>

<!-- ── Main ring (r 65–125) ── -->
