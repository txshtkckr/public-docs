<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 236" width="520" height="236">
<defs>
<style>
text  { font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; }
.hd   { font-size: 9.5px; font-weight: 700; fill: #444; text-anchor: middle; }
.c    { font-size: 10px; fill: #333; }
.f    { font-size: 10px; font-weight: 700; fill: #222; }
.s    { font-size: 8.5px; fill: #555; }
.box  { fill: #FFFFFF; stroke: #555; stroke-width: 1.2; }
.bad  { fill: #F0F0F0; stroke: #333; stroke-width: 1.6; }
.good { fill: #FFFFFF; stroke: #333; stroke-width: 1.6; stroke-dasharray: 5 3; }
.ar   { stroke: #555; stroke-width: 1.4; fill: none; }
.ah   { fill: #555; }
@media (prefers-color-scheme: dark) {
  .hd { fill: #CCC; }
  .c { fill: #E6E6E6; }
  .f { fill: #F2F2F2; }
  .s { fill: #AAA; }
  .box { fill: #1E1E1E; stroke: #AAA; }
  .bad { fill: #333333; stroke: #CCC; }
  .good { fill: #1E1E1E; stroke: #CCC; }
  .ar { stroke: #AAA; }
  .ah { fill: #AAA; }
}
</style>
<marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
  <path class="ah" d="M0 0 L8 4 L0 8 Z"/>
</marker>
</defs>

<!-- Each row: a storage condition (left) leads to the result (right). Faults have a solid
     outline; the good outcome a dashed one. Every box is labelled, so nothing relies on shade. -->
<text class="hd" x="120" y="16">How the sake was kept</text>
<text class="hd" x="380" y="16">What you smell</text>

<rect class="box" x="10" y="26" width="220" height="40" rx="4"/>
<text class="c" x="20" y="43">Unpasteurised (namazake),</text>
<text class="c" x="20" y="57">kept warm</text>
<path class="ar" d="M232 46 H266" marker-end="url(#tip)"/>
<rect class="bad" x="270" y="26" width="240" height="40" rx="4"/>
<text class="f" x="280" y="43">Nama-hine-ka</text>
<text class="s" x="280" y="57">isovaleraldehyde, from live kōji enzymes</text>

<rect class="box" x="10" y="76" width="220" height="40" rx="4"/>
<text class="c" x="20" y="93">Pasteurised, but kept</text>
<text class="c" x="20" y="107">too warm or too long</text>
<path class="ar" d="M232 96 H266" marker-end="url(#tip)"/>
<rect class="bad" x="270" y="76" width="240" height="40" rx="4"/>
<text class="f" x="280" y="93">Hine-ka</text>
<text class="s" x="280" y="107">DMTS, from a precursor the yeast makes</text>

<rect class="box" x="10" y="126" width="220" height="40" rx="4"/>
<text class="c" x="20" y="143">Clear or blue bottle</text>
<text class="c" x="20" y="157">left in the light</text>
<path class="ar" d="M232 146 H266" marker-end="url(#tip)"/>
<rect class="bad" x="270" y="126" width="240" height="40" rx="4"/>
<text class="f" x="280" y="143">Light-struck smell</text>
<text class="s" x="280" y="157">3-methylindole and mercaptans</text>

<rect class="box" x="10" y="176" width="220" height="40" rx="4"/>
<text class="c" x="20" y="193">Cool (5–15 °C) and dark,</text>
<text class="c" x="20" y="207">drunk within a month of opening</text>
<path class="ar" d="M232 196 H266" marker-end="url(#tip)"/>
<rect class="good" x="270" y="176" width="240" height="40" rx="4"/>
<text class="f" x="280" y="193">Fresh sake</text>
<text class="s" x="280" y="207">namazake, sparkling and ginjō at 4 °C or below</text>

<text class="s" x="260" y="232" text-anchor="middle">Solid outline: a fault. Dashed outline: no fault.</text>
</svg>
