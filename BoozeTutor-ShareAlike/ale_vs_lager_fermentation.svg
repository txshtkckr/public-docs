<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 218" width="300" height="218">
<defs>
<style>
text    { font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; }
.ttl    { font-size: 10px; font-weight: 700; text-anchor: middle; }
.tmp    { font-size: 9.5px; text-anchor: middle; }
.ylab   { font-size: 9.5px; font-weight: 600; text-anchor: middle; fill: #000; }
.warm   { fill: #C03020; }
.cold   { fill: #1558A8; }
.beer   { fill: #B8D8F0; }
.metal  { fill: #C8C8C8; }
.hull   { fill: none; stroke: #888; stroke-width: 1.5; stroke-linejoin: round; }
.fix    { fill: #AAAAAA; stroke: #888; stroke-width: 0.8; }
.surf   { stroke: #7AAAC0; stroke-width: 0.8; }
.yeast  { fill: #C89040; }
</style>
</defs>

<!-- ══ LEFT TANK — ALES (cx=78) ══ -->

<!-- Liquid fill — starts at y=88, leaving air gap y=63→88 -->
<rect class="beer" x="45" y="76" width="66" height="79"/>
<!-- Dome (silver) -->
<path class="metal" d="M 45 63 A 33 21 0 0 1 111 63 Z"/>
<!-- Cone (silver) -->
<path class="metal" d="M 45 155 L 62 193 L 94 193 L 111 155 Z"/>
<!-- Headspace (air gap y=63→76) -->
<rect x="46" y="63" width="64" height="13" fill="#eeeeee"/>
<!-- Vessel outline -->
<path class="hull"  d="M 45 63 A 33 21 0 0 1 111 63 L 111 155 L 94 193 L 62 193 L 45 155 Z"/>
<!-- Liquid surface -->
<line class="surf" x1="46" y1="76" x2="110" y2="76"/>
<rect class="fix" x="75" y="35" width="6" height="8" rx="1.5"/>
<rect class="fix" x="71" y="193" width="14" height="10" rx="1.5"/>

