<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 222" width="520" height="222">
<defs>
<style>
text  { font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; }
.nm   { font-size: 10px; font-weight: 700; fill: #333; text-anchor: end; }
.val  { font-size: 9px; fill: #333; }
.ds   { font-size: 9px; fill: #555; text-anchor: middle; }
.ax   { font-size: 9px; fill: #555; text-anchor: middle; }
.axt  { font-size: 9.5px; font-weight: 700; fill: #444; text-anchor: middle; }
.bar  { fill: #D9C27A; stroke: #9A8040; stroke-width: 1; }
.axis { stroke: #888; stroke-width: 1; }
.tick { stroke: #888; stroke-width: 1; }
@media (prefers-color-scheme: dark) {
  .nm, .val { fill: #E6E6E6; }
  .ds, .ax { fill: #AAA; }
  .axt { fill: #CCC; }
  .bar { fill: #6A5A2A; stroke: #C0A060; }
  .axis, .tick { stroke: #777; }
}
</style>
</defs>

<!-- Carriers of at least one ALDH2*2 copy, 1 − (1 − q)² from the 1000 Genomes allele
     frequencies in Edenberg & McClintick 2018. Scale: 0–50% across x 180–480 (6 px per %). -->

<text class="nm" x="172" y="30">Southern Han Chinese</text>
<rect class="bar" x="180" y="20" width="282" height="14" rx="2"/>
<text class="val" x="467" y="30">47%</text>

<text class="nm" x="172" y="52">Japanese (Tokyo)</text>
<rect class="bar" x="180" y="42" width="252" height="14" rx="2"/>
<text class="val" x="437" y="52">42%</text>

<text class="nm" x="172" y="74">Beijing Han Chinese</text>
<rect class="bar" x="180" y="64" width="174" height="14" rx="2"/>
<text class="val" x="359" y="74">29%</text>

<text class="nm" x="172" y="96">Kinh (Vietnam)</text>
<rect class="bar" x="180" y="86" width="150" height="14" rx="2"/>
<text class="val" x="335" y="96">25%</text>

<text class="nm" x="172" y="118">Dai (China)</text>
<rect class="bar" x="180" y="108" width="48" height="14" rx="2"/>
<text class="val" x="233" y="118">8%</text>

<text class="nm" x="172" y="140">European and African samples</text>
<rect class="bar" x="180" y="130" width="2" height="14"/>
<text class="val" x="187" y="140">under 1%</text>

<!-- Axis -->
<line class="axis" x1="180" y1="154" x2="480" y2="154"/>
<line class="tick" x1="180" y1="154" x2="180" y2="158"/><text class="ax" x="180" y="168">0%</text>
<line class="tick" x1="240" y1="154" x2="240" y2="158"/><text class="ax" x="240" y="168">10%</text>
<line class="tick" x1="300" y1="154" x2="300" y2="158"/><text class="ax" x="300" y="168">20%</text>
<line class="tick" x1="360" y1="154" x2="360" y2="158"/><text class="ax" x="360" y="168">30%</text>
<line class="tick" x1="420" y1="154" x2="420" y2="158"/><text class="ax" x="420" y="168">40%</text>
<line class="tick" x1="480" y1="154" x2="480" y2="158"/><text class="ax" x="480" y="168">50%</text>
<text class="axt" x="330" y="186">People carrying at least one ALDH2*2 copy</text>
<text class="ds" x="260" y="206">Calculated from 1000 Genomes allele frequencies (Edenberg and McClintick, 2018)</text>
</svg>
