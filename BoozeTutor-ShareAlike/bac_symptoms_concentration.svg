    <rect id="background" x="0" y="0" width="960" height="340" fill="#fff"/>
    <g id="symptoms" font-family="'Liberation Sans',Arial,ArialMT,sans-serif" font-size="10">
        <g transform="matrix(1,0,0,1,7,-49.5)">
            <text x="14" y="80">Slowed reactions</text>
            <text x="14" y="98">Lowered inhibitions</text>
            <text x="14" y="116">Lightheadedness</text>
        </g>
        <g transform="matrix(1,0,0,1,124,-49.5)">
            <text x="14" y="80">Feeling of warmth</text>
            <text x="14" y="98">Loss of inhibition</text>
            <text x="14" y="116">Mild euphoria</text>
        </g>
        <g transform="matrix(1,0,0,1,241,-49.5)">
            <text x="14" y="80">Slurred speech</text>
            <text x="14" y="98">Impaired judgement</text>
            <text x="14" y="116">Lowered balance</text>
        </g>
        <g transform="matrix(1,0,0,1,358,-49.5)">
            <text x="14" y="80">Loss of coordination</text>
            <text x="14" y="98">Impaired motor</text>
            <text x="14" y="108">skills</text>
            <text x="14" y="126">Exaggerated</text>
            <text x="14" y="136">behavior</text>
            <text x="14" y="154">Possible nausea</text>
        </g>
        <g transform="matrix(1,0,0,1,592,-49.5)">
            <text x="14" y="80">Difficulty staying</text>
            <text x="14" y="90">awake</text>
            <text x="14" y="108">Lowered heart rate /</text>
            <text x="14" y="118">breathing</text>
            <text x="14" y="136">Lower body</text>
            <text x="14" y="146">temperature</text>
        </g>
        <g transform="matrix(1,0,0,1,709,-49.5)">
            <text x="14" y="80">Onset of comas</text>
            <text x="14" y="98">Nerve centers</text>
            <text x="14" y="108">controlling heart</text>
            <text x="14" y="118">and respiration stop</text>
            <text x="14" y="128">functioning</text>
            <text x="14" y="146">May stop breathing</text>
        </g>
        <g transform="matrix(1,0,0,1,475,-49.5)">
            <text x="14" y="80">Need help standing</text>
            <text x="14" y="98">Numb to pain</text>
            <text x="14" y="116">Impaired gag reflex</text>
            <text x="14" y="134">Blackouts</text>
        </g>
        <text x="840" y="30.5">Death</text>
    </g>
    <g id="lower-label-text" text-anchor="middle" font-family="'Liberation Sans',Arial,ArialMT,sans-serif" font-size="16" font-weight="700">
        <text x="245.5" y="302">Legal BAC limit:</text>
        <text x="245.5" y="320">0.08 (USA)</text>
        <text x="483" y="320">Blood Alcohol Concentration (%)</text>
        <text x="757" y="318" font-size="12">Note: Additional symptoms may occur</text>
    </g>
    <g id="bac-levels" text-anchor="middle" font-family="'Liberation Sans',Arial,ArialMT,sans-serif" font-size="14" font-weight="700">
        <text x="78" y="281">0.02–0.03</text>
        <text x="198" y="281">0.03–0.06</text>
        <text x="318" y="281">0.06–0.10</text>
        <text x="437" y="281">0.10–0.20</text>
        <text x="556" y="281">0.20–0.30</text>
        <text x="675" y="281">0.30–0.40</text>
        <text x="794" y="281">0.40–0.50</text>
        <text x="898" y="281">≥ 0.50</text>
    </g>
